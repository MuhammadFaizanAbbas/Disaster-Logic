<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#19293d">
  <title>Account access | Disaster Logic</title>
  <link rel="preload" href="assets/fonts/source-sans-3/source-sans-3-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/live.css">
</head>
<body class="access-body">
  <main class="access-shell">
    <header class="access-intro">
      <a class="access-brand" href="login.html" aria-label="Disaster Logic home">
        <span class="access-brand-mark" aria-hidden="true">D</span>
        <span>Disaster Logic</span>
      </a>
      <h1 id="page-heading">Sign in to continue.</h1>
      <p id="page-description">Access your workspace, review recent activity, and pick up where you left off.</p>
    </header>

    <section class="access-card" aria-labelledby="access-title">
      <p class="access-kicker">Account access</p>
      <h2 id="access-title">Welcome back</h2>

      <div class="access-tabs" role="tablist" aria-label="Account action">
        <button class="active" data-mode="signin" type="button" role="tab" aria-selected="true">Sign in</button>
        <button data-mode="signup" type="button" role="tab" aria-selected="false">Create account</button>
      </div>

      <button class="access-google" id="google-auth" type="button">
        <svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285f4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.3c1.9-1.8 2.9-4.4 2.9-7.4Z"/>
          <path fill="#34a853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.5c-.9.6-2 1-3.4 1a5.9 5.9 0 0 1-5.5-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/>
          <path fill="#fbbc05" d="M6.5 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9.1L6.5 14Z"/>
          <path fill="#ea4335" d="M12 6c1.5 0 2.8.5 3.9 1.5l2.9-2.8A9.8 9.8 0 0 0 3.1 7.5l3.4 2.6A5.9 5.9 0 0 1 12 6Z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="access-divider"><span>or continue with email</span></div>

      <form id="access-form" class="access-form">

        <label class="access-field" for="email">
          <span>Email address</span>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>

        <label class="access-field" for="password">
          <span>Password</span>
          <span class="access-password">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="password-toggle" data-password="password" type="button" aria-label="Show password">Show</button>
          </span>
        </label>

        <p id="login-feedback" class="login-feedback" role="status" aria-live="polite"></p>
        <button id="login-submit" class="login-submit primary">Sign in</button>
        <button id="magic-link" class="access-magic" type="button">Email me a sign-in link</button>
      </form>
    </section>

    <p class="access-footnote">By continuing, you agree to securely access Disaster Logic.</p>
  </main>

  <div class="loading-overlay" id="auth-loading" hidden aria-live="polite">
    <span class="loading-spinner" aria-hidden="true"></span>
    <span id="loading-text">Signing in…</span>
  </div>

  <noscript><p class="login-noscript">JavaScript is required to sign in.</p></noscript>
  <script defer src="js/vendor/supabase.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/onboarding-ui.js"></script>
  <script defer src="js/onboarding-templates.js"></script>
  <script defer src="js/onboarding-flow.js"></script>
  <script defer src="js/login.js"></script>
</body>
</html>
